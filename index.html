<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Learning Hub</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --sidebar-bg: #1e293b; }
        body { margin: 0; display: flex; background-color: var(--bg); color: white; font-family: sans-serif; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: var(--sidebar-bg); padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #334155; }
        .sidebar h2 { color: #facc15; font-size: 1.2rem; margin-bottom: 20px; }
        .menu-btn { background: #334155; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.3s; font-size: 0.9rem; }
        .menu-btn.active, .menu-btn:hover { background: var(--primary); }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 10px 30px; border-radius: 50px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; perspective: 1000px; }
        .card { width: 85px; height: 85px; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.5s; }
        .card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: bold; font-size: 0.8rem; text-align: center; padding: 5px; box-sizing: border-box; }
        .card-back { background-color: var(--primary); color: white; font-size: 1.5rem; }
        .card-back::after { content: attr(data-hint); position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: #facc15; color: #000; padding: 6px; border-radius: 5px; font-size: 0.7rem; width: 130px; display: none; z-index: 100; }
        .card:hover .card-back::after { display: block; }
        .card-front { background-color: white; color: var(--bg); transform: rotateY(180deg); }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; } .card { width: 65px; height: 65px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>IT Hub Menu</h2>
        <button class="menu-btn active" onclick="startGame('langs')">💻 Programming Languages</button>
        <button class="menu-btn" onclick="startGame('parts')">🖥️ Computer Parts</button>
    </div>
    <div class="main-content">
        <h1 id="game-title">Programming Languages</h1>
        <div class="stats">
            <div>Time: <span id="time">0</span>s</div>
            <div>Attempts: <span id="flips">0</span></div>
        </div>
        <div id="grid" class="grid"></div>
    </div>
    <script>
