<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - IT Edition</title>
    <style>
        /* التنسيق الأصلي للعبة مع لمسة احترافية */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar h2 { font-size: 1.2rem; text-align: center; border-bottom: 1px solid #455d7a; padding-bottom: 10px; }

        .nav-btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .nav-btn.active, .nav-btn:hover { background: #3498db; transform: scale(1.05); }

        /* منطقة اللعبة */
        .game-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header { text-align: center; color: #2c3e50; }

        .stats {
            display: flex;
            gap: 40px;
            margin: 20px 0;
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
        }

        /* الشبكة والبطاقات - رجعنا الستايل القديم */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card {
            width: 100px;
            height: 100px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            font-weight: bold;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }

        /* ظهر البطاقة (الأزرق الأصلي) */
        .card-back {
            background-color: #3498db;
            color: white;
            font-size: 2.5rem;
        }

        /* وجه البطاقة (الأبيض) */
        .card-front {
            background-color: #ffffff;
            color: #2c3e50;
            transform: rotateY(180deg);
            font-size: 0.9rem;
        }

        @media (max-width: 700px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; padding: 10px; }
            .grid { gap: 8px; }
            .card { width: 75px; height: 75px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>IT Menu</h2>
    <button id="btn-langs" class="nav-btn active" onclick="switchMode('langs')">Languages</button>
    <button id="btn-parts" class="nav-btn" onclick="switchMode('parts')">PC Parts</button>
</div>

<div class="game-area">
    <div class="header">
        <h1 id="game-title">Memory Match: Programming</h1>
    </div>
    
    <div class="stats">
        <div>Time: <span id="timer">0</span>s</div>
        <div>Matches: <span id="match-count">0</span>/8</div>
    </div>

    <div class="grid" id="game-grid"></div>
</div>

<script>
    const data = {
        langs: [
            {n:'Python'}, {n:'C++'}, {n:'JavaScript'}, {n:'SQL'},
            {n:'Java'}, {n:'Swift'}, {n:'HTML'}, {n:'CSS'}
],
        parts: [
            {n:'CPU'}, {n:'RAM'}, {n:'GPU'}, {n:'Monitor'},
            {n:'Keyboard'}, {n:'SSD'}, {n:'Motherboard'}, {n:'Mouse'}
        ]
    };

    let currentMode = 'langs';
    let flippedCards = [];
    let matchedPairs = 0;
    let time = 0;
    let timerId;

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('game-title').innerText = mode === 'langs' ? 'Memory Match: Programming' : 'Memory Match: PC Parts';
        document.getElementById('btn-langs').classList.toggle('active', mode === 'langs');
        document.getElementById('btn-parts').classList.toggle('active', mode === 'parts');
        initGame();
    }

    function initGame() {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        matchedPairs = 0;
        time = 0;
        flippedCards = [];
        clearInterval(timerId);
        document.getElementById('match-count').innerText = '0';
        document.getElementById('timer').innerText = '0';

        const gameItems = [...data[currentMode], ...data[currentMode]].sort(() => Math.random() - 0.5);

        gameItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-back">?</div>
                <div class="card-front">${item.n}</div>
            `;
            card.addEventListener('click', () => flip(card, item.n));
            grid.appendChild(card);
        });

        timerId = setInterval(() => {
            time++;
            document.getElementById('timer').innerText = time;
        }, 1000);
    }

    function flip(card, name) {
        if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
            card.classList.add('flipped');
            flippedCards.push({card, name});

            if (flippedCards.length === 2) {
                if (flippedCards[0].name === flippedCards[1].name) {
                    matchedPairs++;
                    document.getElementById('match-count').innerText = matchedPairs;
                    flippedCards = [];
                    if (matchedPairs === 8) {
                        clearInterval(timerId);
                        setTimeout(() => alert('عاشت إيدج يا فاطمة! كملتي اللعبة بنجاح'), 500);
                    }
                } else {
                    setTimeout(() => {
                        flippedCards.forEach(c => c.card.classList.remove('flipped'));
                        flippedCards = [];
                    }, 1000);
                }
            }
        }
    }

    // Start initial game
    switchMode('langs');
</script>

</body>
</html>
