<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmers Challenge — Memory Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src='https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js'></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.45);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
      --text: #2d1b4e;
      --text-muted: rgba(45, 27, 78, 0.75);
      --flip-duration: 0.72s;
      --flip-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Outfit", system-ui, sans-serif;
      background: linear-gradient(145deg, #d4c4f9 0%, #c4b5fd 25%, #a5d8ff 75%, #7dd3fc 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: var(--text);
      overflow-x: hidden;
    }

    /* —— Start screen —— */
    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: linear-gradient(145deg, rgba(212, 196, 249, 0.55) 0%, rgba(196, 181, 253, 0.5) 35%, rgba(165, 216, 255, 0.5) 70%, rgba(125, 211, 252, 0.55) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.45s ease, visibility 0.45s ease, transform 0.45s var(--flip-ease);
    }

    .start-screen.start-screen--hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.97);
    }

    .start-inner {
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.5rem 2.25rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), 0 24px 80px rgba(99, 102, 241, 0.12);
      backdrop-filter: blur(26px) saturate(1.45);
      -webkit-backdrop-filter: blur(26px) saturate(1.45);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .start-title {
      font-size: clamp(1.65rem, 6vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 1rem;
      direction: ltr;
      line-height: 1.15;
    }

    .start-emoji {
      width: 100px;
      height: 100px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.95rem;
      filter: drop-shadow(0 6px 20px rgba(99, 102, 241, 0.25));
      user-select: none;
    }

    .start-emoji svg {
      width: 100%;
      height: 100%;
    }

    .start-diff {
      margin-bottom: 0;
    }

    .start-diff .btn-diff {
      font-size: 0.82rem;
      padding: 0.6rem 1rem;
    }

    /* —— Game view —— */
    .app {
      width: 100%;
      max-width: 980px;
      max-height: 100vh;
      overflow: hidden;
      transition: max-width 0.35s var(--flip-ease);
    }

    .app.app-easy {
      max-width: 760px;
    }

    .app.app-medium {
      max-width: 860px;
    }

    .app.app-hard {
      max-width: 940px;
    }

    /* —— Difficulty —— */
    .diff-bar {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .btn-diff {
      padding: 0.5rem 0.95rem;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      box-shadow: var(--glass-shadow);
      transition: transform 0.2s var(--flip-ease), background 0.25s ease, border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn-diff:hover {
      transform: scale(1.03);
    }

    .btn-diff:active {
      transform: scale(0.98);
    }

    .btn-diff.active {
      background: rgba(99, 102, 241, 0.38);
      border-color: rgba(129, 140, 248, 0.85);
      color: #1e1b4b;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.28), var(--glass-shadow);
    }

    .app.app-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }

    .game-title {
      font-size: clamp(1rem, 3.8vw, 1.35rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      direction: ltr;
      margin: 0;
    }

    .game-emoji {
      width: clamp(1.75rem, 6vw, 2.25rem);
      height: clamp(1.75rem, 6vw, 2.25rem);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .game-emoji svg {
      width: 100%;
      height: 100%;
    }

    .mascot-monitor {
      overflow: visible;
    }

    .mascot-eye-open,
    .mascot-eye-closed {
      transform-origin: center;
      transition: opacity 0.15s ease;
    }

    .mascot-eye-closed {
      opacity: 0;
    }

    .mascot-monitor.is-blinking .mascot-eye-open {
      opacity: 0;
    }

    .mascot-monitor.is-blinking .mascot-eye-closed {
      opacity: 1;
    }

    .game-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-bottom: 0.85rem;
    }

    .btn-home {
      padding: 0.45rem 0.9rem;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .btn-home:hover {
      transform: scale(1.04);
      color: var(--text);
    }

    /* —— HUD —— */
    .hud {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .stat {
      flex: 1;
      min-width: 130px;
      padding: 0.85rem 1.1rem;
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      text-align: center;
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.35rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .btn-restart {
      align-self: center;
      margin-top: 0.5rem;
      padding: 0.55rem 1.15rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s var(--flip-ease), box-shadow 0.2s;
    }

    .btn-restart:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
    }

    .btn-restart:active {
      transform: scale(0.98);
    }

    .game-shell {
      display: flex;
      flex-direction: row-reverse;
      gap: 1rem;
      align-items: start;
      margin-bottom: 1rem;
    }

    .info-panel {
      width: min(220px, 100%);
      flex: 0 0 220px;
      padding: 1rem 0.95rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 10px 30px rgba(31, 38, 135, 0.11);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
    }

    .info-panel.info-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition: opacity 0.38s ease, transform 0.38s ease;
    }

    .info-panel.fade-in {
      animation: info-fade-in 0.4s ease;
    }

    @keyframes info-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .info-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      direction: ltr;
    }

    .info-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .info-desc {
      margin-top: 0.55rem;
      font-size: 0.93rem;
      line-height: 1.6;
      color: rgba(45, 27, 78, 0.9);
      min-height: 3.2em;
      max-width: 26ch;
    }

    .info-icon {
      margin-top: 0.95rem;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .info-icon .card-fa {
      font-size: 2.35rem;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.16));
    }

    .info-icon .card-brand-svg {
      width: 2.45rem;
      height: 2.45rem;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.16));
    }

    .game-main {
      min-width: 0;
      flex: 1 1 auto;
      margin-left: 20px;
    }

    /* —— Board —— */
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.78rem;
      perspective: 1200px;
      transition: gap 0.25s ease;
      max-width: 620px;
      margin-left: auto;
      margin-right: 0;
    }

    .app-hard .board {
      gap: 0.5rem;
    }

    .app-easy .board {
      gap: 0.75rem;
    }

    .card-wrap {
      aspect-ratio: 1;
      cursor: pointer;
      border-radius: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    .card-wrap.disabled {
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: center center;
      border-radius: 14px;
      transition: transform var(--flip-duration) var(--flip-ease);
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --flip-duration: 0.2s;
        --flip-ease: ease-out;
      }
    }

    .card-wrap.flipped .card {
      transform: rotateY(180deg);
    }

    .card-wrap.matched .card {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .face.back {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.12) 100%);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      transform: rotateY(0deg);
    }

    .face.back::after {
      content: "";
      width: 42%;
      height: 42%;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(56, 189, 248, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .face.front {
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      transform: rotateY(180deg);
      flex-direction: column;
      padding: 0.35rem 0.25rem 0.45rem;
    }

    .card-front-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .card-icon-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
    }

    .card-label {
      font-family: ui-sans-serif, system-ui, "Segoe UI", "Outfit", sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(248, 250, 252, 0.95);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
      letter-spacing: 0.03em;
      line-height: 1.15;
      text-align: center;
      flex-shrink: 0;
      direction: ltr;
      unicode-bidi: embed;
    }

    .card-wrap.matched .face.front {
      border-color: rgba(167, 243, 208, 0.8);
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.35), var(--glass-shadow);
    }

    .face.front .card-fa {
      font-size: clamp(2.45rem, 11vw, 3.85rem);
      line-height: 1;
      filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.2));
    }

    .app-easy .face.front .card-fa {
      font-size: clamp(2.65rem, 15vw, 4.15rem);
    }

    .app-easy .face.front .card-brand-svg {
      width: clamp(2.85rem, 16vw, 4.35rem);
      height: clamp(2.85rem, 16vw, 4.35rem);
    }

    .app-hard .face.front .card-fa {
      font-size: clamp(1.65rem, 5.2vw, 2.55rem);
    }

    .app-hard .face.front .card-brand-svg {
      width: clamp(1.75rem, 5.8vw, 2.75rem);
      height: clamp(1.75rem, 5.8vw, 2.75rem);
    }

    .app-hard .card-label {
      font-size: 10px;
    }

    .face.front .card-fa.card-fa-js {
      color: #f7df1e;
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.45)) drop-shadow(0 3px 12px rgba(0, 0, 0, 0.22));
    }

    .card-tech-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.2em;
      padding: 0.2em 0.44em;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.95), rgba(56, 189, 248, 0.92));
      color: #f8fafc;
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(1.1rem, 4.2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
    }

    .info-icon .card-tech-badge {
      font-size: 1.45rem;
      min-width: 2.4em;
    }

    /* شعار C++ غير متوفر في Font Awesome — SVG رسمي (مصدر: Simple Icons) */
    .face.front .card-brand-svg {
      width: clamp(2.65rem, 12vw, 4.1rem);
      height: clamp(2.65rem, 12vw, 4.1rem);
      flex-shrink: 0;
      filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.2));
    }

    /* —— Win overlay —— */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 27, 78, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
      z-index: 100;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      max-width: 340px;
      width: 100%;
      padding: 1.75rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(99, 102, 241, 0.2);
      text-align: center;
      transform: scale(0.92);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .overlay.open .modal {
      transform: scale(1);
    }

    .modal h2 {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
    }

    .modal p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text);
      opacity: 0.9;
    }

    @media (min-width: 400px) {
      .board {
        gap: 0.85rem;
      }
    }

    @media (max-width: 780px) {
      .game-shell {
        flex-direction: column;
      }

      .game-main {
        margin-left: 0;
      }

      .info-panel {
        width: 100%;
        flex: 0 0 auto;
        min-height: 0;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 0.55rem;
      }

      .start-inner {
        padding: 1.15rem 0.85rem 1.2rem;
      }

      .start-emoji {
        width: 84px;
        height: 84px;
        margin-bottom: 0.5rem;
      }

      .game-header {
        gap: 0.35rem;
        margin-bottom: 0.35rem;
      }

      .game-title {
        font-size: clamp(0.9rem, 3.3vw, 1.05rem);
      }

      .game-emoji {
        width: 1.5rem;
        height: 1.5rem;
      }

      .game-toolbar {
        margin-bottom: 0.42rem;
      }

      .game-shell {
        gap: 0.55rem;
        margin-bottom: 0.4rem;
      }

      .info-panel {
        padding: 0.5rem 0.52rem;
        border-radius: 12px;
      }

      .info-name {
        font-size: 1rem;
      }

      .info-meta {
        font-size: 0.8rem;
      }

      .info-desc {
        font-size: 0.8rem;
        line-height: 1.4;
        min-height: 2.5em;
      }

      .hud {
        gap: 0.45rem;
        margin-bottom: 0.65rem;
      }

      .stat {
        min-width: 106px;
        padding: 0.54rem 0.62rem;
        border-radius: 12px;
      }

      .stat-label {
        font-size: 0.64rem;
      }

      .stat-value {
        font-size: 1.08rem;
      }

      .btn-restart {
        margin-top: 0.25rem;
      }

      .board {
        width: 100%;
        max-width: 100%;
        gap: 0.56rem;
        justify-content: center;
        margin-inline: auto;
      }

      .card-wrap {
        min-height: 66px;
      }
    }
  </style>
</head>
<body>
  <div class="start-screen" id="startScreen" aria-label="شاشة البداية">
    <div class="start-inner">
      <div class="start-emoji" aria-hidden="true">
        <svg class="mascot-monitor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute computer icon">
          <rect x="3" y="4.5" width="18" height="12" rx="2.2" fill="#60A5FA"/>
          <rect x="4.4" y="5.9" width="15.2" height="9.2" rx="1.4" fill="#F8FBFF"/>
          <circle class="mascot-eye-open" cx="9.3" cy="10.1" r="1.05" fill="#1E3A8A"/>
          <circle class="mascot-eye-open" cx="14.7" cy="10.1" r="1.05" fill="#1E3A8A"/>
          <line class="mascot-eye-closed" x1="8.4" y1="10.1" x2="10.2" y2="10.1" stroke="#1E3A8A" stroke-width="1.1" stroke-linecap="round"/>
          <line class="mascot-eye-closed" x1="13.8" y1="10.1" x2="15.6" y2="10.1" stroke="#1E3A8A" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M9.1 12.7c.58.6 1.45.95 2.9.95s2.32-.35 2.9-.95" fill="none" stroke="#1E3A8A" stroke-width="1.05" stroke-linecap="round"/>
          <rect x="10" y="17.5" width="4" height="1.8" rx="0.6" fill="#2563EB"/>
          <rect x="8" y="19.3" width="8" height="1.7" rx="0.7" fill="#3B82F6"/>
        </svg>
      </div>
      <h1 class="start-title">Programmers Challenge</h1>
      <div class="diff-bar start-diff" role="group" aria-label="اختر مستوى الصعوبة">

        <button type="button" class="btn-diff active" data-diff="medium" id="diffMedium">متوسط · Medium</button>

  <div class="app app-medium app-hidden" id="app">
    <header class="game-header">
      <h2 class="game-title">Programmers Challenge</h2>
      <span class="game-emoji" aria-hidden="true">
        <svg class="mascot-monitor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute computer icon">
          <rect x="3" y="4.5" width="18" height="12" rx="2.2" fill="#60A5FA"/>

          <circle class="mascot-eye-open" cx="9.3" cy="10.1" r="1.05" fill="#1E3A8A"/>

          <line class="mascot-eye-closed" x1="8.4" y1="10.1" x2="10.2" y2="10.1" stroke="#1E3A8A" stroke-width="1.1" stroke-linecap="round"/>

          <path d="M9.1 12.7c.58.6 1.45.95 2.9.95s2.32-.35 2.9-.95" fill="none" stroke="#1E3A8A" stroke-width="1.05" stroke-linecap="round"/>
          <rect x="10" y="17.5" width="4" height="1.8" rx="0.6" fill="#2563EB"/>

    <div class="game-toolbar">
      <button type="button" class="btn-home" id="btnHome">الرئيسية</button>

      <aside class="info-panel" id="infoPanel" aria-live="polite">
        <h3 class="info-name" id="infoName"></h3>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">

  <script>
    (function () {
      var CPP_SVG =
        '<svg class="card-brand-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<path fill="#00599C" d="M22.394 6c-.167-.29-.398-.543-.652-.69L12.926.22c-.509-.294-1.34-.294-1.848 0L2.26 5.31c-.508.293-.923 1.013-.923 1.6v10.18c0 .294.104.62.271.91.167.29.398.543.652.69l8.816 5.09c.508.293 1.34.293 1.848 0l8.816-5.09c.254-.147.485-.4.652-.69.167-.29.27-.616.27-.91V6.91c.003-.294-.1-.62-.268-.91zM12 19.11c-3.92 0-7.109-3.19-7.109-7.11 0-3.92 3.19-7.11 7.11-7.11a7.133 7.133 0 016.156 3.553l-3.076 1.78a3.567 3.567 0 00-3.08-1.78A3.56 3.56 0 008.444 12 3.56 3.56 0 0012 15.555a3.57 3.57 0 003.08-1.778l3.078 1.78A7.135 7.135 0 0112 19.11zm7.11-6.715h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79zm2.962 0h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79z"/>' +
        "</svg>";

      const ALL_PAIRS = [
        {
          id: "cplusplus",
          label: "C++",
          markup: CPP_SVG,
        },
        {
          id: "python",
          label: "Python",
          markup:
            '<i class="fa-brands fa-python card-fa" style="color:#3776AB" aria-hidden="true"></i>',
        },
        {
          id: "java",
          label: "Java",
          markup:
            '<i class="fa-brands fa-java card-fa" style="color:#EA2D2E" aria-hidden="true"></i>',
        },
        {
          id: "javascript",
          label: "JavaScript",
          markup:
            '<i class="fa-brands fa-js card-fa card-fa-js" aria-hidden="true"></i>',
        },
        {
          id: "html5",
          label: "HTML",
          markup:
            '<i class="fa-brands fa-html5 card-fa" style="color:#E34F26" aria-hidden="true"></i>',
        },
        {
          id: "csharp",
          label: "C#",
          markup:
            '<span class="card-tech-badge" aria-hidden="true">C#</span>',
        },
        {
          id: "php",
          label: "PHP",
          markup:
            '<i class="fa-brands fa-php card-fa" style="color:#777BB4" aria-hidden="true"></i>',
        },
        {
          id: "swift",
          label: "Swift",
          markup:
            '<i class="fa-brands fa-swift card-fa" style="color:#FA7343" aria-hidden="true"></i>',
        },
        {
          id: "ruby",
          label: "Ruby",
          markup:
            '<i class="fa-solid fa-gem card-fa" style="color:#CC342D" aria-hidden="true"></i>',
        },
        {
          id: "go",
          label: "Go",
          markup:
            '<span class="card-tech-badge" aria-hidden="true">Go</span>',
        },
        {
          id: "sql",
          label: "SQL",
          markup:
            '<i class="fa-solid fa-database card-fa" style="color:#0EA5E9" aria-hidden="true"></i>',
        },
        {
          id: "rust",
          label: "Rust",
          markup:
            '<span class="card-tech-badge" aria-hidden="true">Rs</span>',
        },
        {
          id: "kotlin",
          label: "Kotlin",
          markup:
            '<span class="card-tech-badge" aria-hidden="true">Kt</span>',
        },
        {
          id: "typescript",
          label: "TypeScript",
          markup:
            '<span class="card-tech-badge" aria-hidden="true">TS</span>',
        },
        {
          id: "docker",
          label: "Docker",
          markup:
            '<i class="fa-brands fa-docker card-fa" style="color:#2496ED" aria-hidden="true"></i>',
        },
      ];

      const LANGUAGE_INFO = {
        cplusplus: {
          inventor: "بيارن ستروستروب",
          year: "1985",
          desc: "لغة قوية لتطوير الأنظمة والألعاب.",
        },
        python: {
          inventor: "غيدو فان روسوم",
          year: "1991",
          desc: "لغة بسيطة وعالمية للذكاء الاصطناعي.",
        },
        java: {
          inventor: "جيمس غوسلينغ",
          year: "1995",
          desc: "شعارها 'اكتب مرة واحدة، شغل في أي مكان'.",
        },
        javascript: {
          inventor: "برندان آيخ",
          year: "1995",
          desc: "هي المحرك الأساسي لتفاعلية صفحات الويب.",
        },
        html5: {
          inventor: "تيم بيرنرز لي",
          year: "1993",
          desc: "لغة هيكلة صفحات الإنترنت الأساسية.",
        },
        csharp: {
          inventor: "أندرس هيجلسبرج",
          year: "2000",
          desc: "لغة قوية من مايكروسوفت لتطبيقات الويب وسطح المكتب.",
        },
        php: {
          inventor: "راسموس ليردورف",
          year: "1995",
          desc: "لغة خادمية شهيرة لتطوير تطبيقات ومواقع الويب.",
        },
        swift: {
          inventor: "كريس لاثنر",
          year: "2014",
          desc: "لغة حديثة من Apple لبناء تطبيقات iOS وmacOS.",
        },
        ruby: {
          inventor: "يوكيهيرو ماتسوموتو",
          year: "1995",
          desc: "لغة أنيقة تركز على بساطة المطوّر وسرعة الإنتاج.",
        },
        go: {
          inventor: "روبرت غريسمر وروب بايك وكين تومسون",
          year: "2009",
          desc: "لغة سريعة وبسيطة للخدمات الخلفية والأنظمة الموزعة.",
        },
        sql: {
          inventor: "دونالد شامبرلين ورايموند بويس",
          year: "1974",
          desc: "لغة الاستعلام القياسية لإدارة قواعد البيانات.",
        },
        rust: {
          inventor: "غرايدون هوار",
          year: "2010",
          desc: "لغة آمنة وعالية الأداء للأنظمة منخفضة المستوى.",
        },
        kotlin: {
          inventor: "JetBrains",
          year: "2011",
          desc: "لغة حديثة لتطوير تطبيقات Android والخوادم.",
        },
        typescript: {
          inventor: "أندرس هيجلسبرج",
          year: "2012",
          desc: "امتداد Typed لـ JavaScript لتطبيقات كبيرة وأكثر أمانًا.",
        },
        docker: {
          inventor: "سولومون هايكِس",
          year: "2013",
          desc: "منصة حاويات لتشغيل التطبيقات بشكل موحد عبر البيئات.",
        },
      };

      const DIFFICULTY = {
        easy: { pairCount: 4, cols: 4 },
        medium: { pairCount: 6, cols: 4 },
        hard: { pairCount: 8, cols: 4 },
      };

      const boardEl = document.getElementById("board");
      const appEl = document.getElementById("app");
      const timerEl = document.getElementById("timer");
      const movesEl = document.getElementById("moves");
      const restartBtn = document.getElementById("restart");
      const overlay = document.getElementById("overlay");
      const winMsg = document.getElementById("winMsg");
      const playAgainBtn = document.getElementById("playAgain");
      const startScreen = document.getElementById("startScreen");
      const btnHome = document.getElementById("btnHome");
      const diffButtons = document.querySelectorAll("#startScreen .btn-diff");
      const infoPanel = document.getElementById("infoPanel");
      const infoIcon = document.getElementById("infoIcon");
      const infoName = document.getElementById("infoName");
      const infoInventor = document.getElementById("infoInventor");
      const infoYear = document.getElementById("infoYear");
      const infoDesc = document.getElementById("infoDesc");

      let difficulty = "medium";
      let totalCards = 16;
      let cards = [];
      let flipped = [];
      let lock = false;
      let moves = 0;
      let matched = 0;
      let timerId = null;
      let seconds = 0;
      let started = false;
      let audioCtx = null;

      function ensureAudioContext() {
        if (audioCtx) return audioCtx;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
        return audioCtx;
      }

      function playBeep(freq, durationMs, volume) {
        const ctx = ensureAudioContext();
        if (!ctx) return;
        if (ctx.state === "suspended") {
          ctx.resume().catch(function () {});
        }

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs / 1000);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + durationMs / 1000 + 0.02);
      }

      function soundFlip() {
        playBeep(400, 70, 0.028);
      }

      function soundMatch() {
        playBeep(800, 110, 0.032);
      }

      function scheduleMascotBlink() {
        const mascots = document.querySelectorAll(".mascot-monitor");

        function queueNextBlink() {
          const delay = 3000 + Math.floor(Math.random() * 2000);
          setTimeout(function () {
            mascots.forEach(function (el) {
              el.classList.add("is-blinking");
            });
            setTimeout(function () {
              mascots.forEach(function (el) {
                el.classList.remove("is-blinking");
              });
              queueNextBlink();
            }, 170);
          }, delay);
        }

        queueNextBlink();
      }

      function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      }

      function startTimer() {
        if (started) return;
        started = true;
        timerId = setInterval(function () {
          seconds++;
          timerEl.textContent = formatTime(seconds);
        }, 1000);
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function getActivePairs() {
        var n = DIFFICULTY[difficulty].pairCount;
        return ALL_PAIRS.slice(0, n);
      }

      function getPairById(id) {
        return ALL_PAIRS.find(function (p) {
          return p.id === id;
        });
      }

      function resetInfoPanel() {
        infoName.textContent = "";
        infoInventor.textContent = "المخترع: —";
        infoYear.textContent = "سنة الابتكار: —";
        infoDesc.textContent = "";
        infoIcon.innerHTML = "";
        infoPanel.classList.remove("info-visible", "fade-in");
      }

      function showLanguageInfo(pairId) {
        var details = LANGUAGE_INFO[pairId];
        if (!details) return;

        infoName.textContent = getPairById(pairId).label;
        infoInventor.textContent = "المخترع: " + details.inventor;
        infoYear.textContent = "سنة الابتكار: " + details.year;
        infoDesc.textContent = details.desc;
        infoIcon.innerHTML = getPairById(pairId).markup;

        infoPanel.classList.add("info-visible");
        infoPanel.classList.remove("fade-in");
        void infoPanel.offsetWidth;
        infoPanel.classList.add("fade-in");
      }

      function fireWinConfetti() {
        if (typeof confetti !== "function") return;
        confetti({
          particleCount: 220,
          spread: 90,
          startVelocity: 48,
          origin: { x: 0.5, y: 0.5 },
          ticks: 220,
          scalar: 1.05,
        });
      }

      function buildDeck() {
        const deck = [];
        getActivePairs().forEach(function (p) {
          deck.push({
            id: p.id,
            label: p.label,
            markup: p.markup,
            uid: p.id + "-a",
          });
          deck.push({
            id: p.id,
            label: p.label,
            markup: p.markup,
            uid: p.id + "-b",
          });
        });
        return shuffle(deck);
      }

      function applyDifficultyUI() {
        var cfg = DIFFICULTY[difficulty];
        totalCards = cfg.pairCount * 2;
        boardEl.style.gridTemplateColumns = "repeat(" + cfg.cols + ", 1fr)";
        appEl.classList.remove("app-easy", "app-medium", "app-hard");
        appEl.classList.add("app-" + difficulty);
        diffButtons.forEach(function (btn) {
          btn.classList.toggle("active", btn.dataset.diff === difficulty);
        });
      }

      function renderBoard() {
        applyDifficultyUI();
        boardEl.innerHTML = "";
        cards = buildDeck();
        cards.forEach(function (data, index) {
          const wrap = document.createElement("div");
          wrap.className = "card-wrap";
          wrap.dataset.index = String(index);
          wrap.dataset.pairId = data.id;
          var labelEsc = String(data.label)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
          wrap.innerHTML =
            '<div class="card" aria-hidden="true">' +
            '<div class="face back"></div>' +
            '<div class="face front">' +
            '<div class="card-front-inner">' +
            '<div class="card-icon-slot">' +
            data.markup +
            "</div>" +
            '<span class="card-label">' +
            labelEsc +
            "</span></div></div></div>";
          wrap.addEventListener("click", onCardClick);
          boardEl.appendChild(wrap);
        });
      }

      function resetGame() {
        stopTimer();
        started = false;
        seconds = 0;
        moves = 0;
        matched = 0;
        flipped = [];
        lock = false;
        timerEl.textContent = "00:00";
        movesEl.textContent = "0";
        overlay.classList.remove("open");
        resetInfoPanel();
        renderBoard();
      }

      function setDifficulty(next) {
        difficulty = next;
        diffButtons.forEach(function (btn) {
          btn.classList.toggle("active", btn.dataset.diff === difficulty);
        });
      }

      function openGameFromStart(chosen) {
        setDifficulty(chosen);
        startScreen.classList.add("start-screen--hide");
        appEl.classList.remove("app-hidden");
        resetGame();
      }

      function goHome() {
        stopTimer();
        started = false;
        overlay.classList.remove("open");
        appEl.classList.add("app-hidden");
        startScreen.classList.remove("start-screen--hide");
      }

      function onCardClick(e) {
        const wrap = e.currentTarget;
        if (lock || wrap.classList.contains("flipped") || wrap.classList.contains("matched")) return;

        startTimer();
        soundFlip();
        wrap.classList.add("flipped");
        flipped.push(wrap);

        if (flipped.length < 2) return;

        lock = true;
        moves++;
        movesEl.textContent = String(moves);

        const a = flipped[0];
        const b = flipped[1];
        const match = a.dataset.pairId === b.dataset.pairId;

        if (match) {
          soundMatch();
          showLanguageInfo(a.dataset.pairId);
          matched += 2;
          a.classList.add("matched");
          b.classList.add("matched");
          flipped = [];
          lock = false;
          if (matched === totalCards) {
            stopTimer();
            winMsg.textContent =
              "أكملت اللعبة في " +
              formatTime(seconds) +
              " و" +
              moves +
              " محاولة.";
            fireWinConfetti();
            overlay.classList.add("open");
          }
        } else {
          setTimeout(function () {
            a.classList.remove("flipped");
            b.classList.remove("flipped");
            flipped = [];
            lock = false;
          }, 820);
        }
      }

      restartBtn.addEventListener("click", resetGame);
      playAgainBtn.addEventListener("click", resetGame);
      btnHome.addEventListener("click", goHome);
      diffButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          openGameFromStart(btn.dataset.diff);
        });
      });
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) overlay.classList.remove("open");
      });

      scheduleMascotBlink();

    })();
  </script>
