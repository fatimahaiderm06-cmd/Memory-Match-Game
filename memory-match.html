<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmers Challenge — Memory Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src='https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js'></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.45);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
      --text: #2d1b4e;
      --text-muted: rgba(45, 27, 78, 0.75);
      --flip-duration: 0.72s;
      --flip-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: auto;
      font-family: "Outfit", system-ui, sans-serif;
      background: linear-gradient(145deg, #d4c4f9 0%, #c4b5fd 25%, #a5d8ff 75%, #7dd3fc 100%);
      background-attachment: fixed;
      color: var(--text);
      overflow-y: visible;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    /* —— Start screen —— */
    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: linear-gradient(145deg, rgba(212, 196, 249, 0.55) 0%, rgba(196, 181, 253, 0.5) 35%, rgba(165, 216, 255, 0.5) 70%, rgba(125, 211, 252, 0.55) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.45s ease, visibility 0.45s ease, transform 0.45s var(--flip-ease);
    }

    .start-screen.start-screen--hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.97);
    }

    .start-inner {
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.5rem 2.25rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), 0 24px 80px rgba(99, 102, 241, 0.12);
      backdrop-filter: blur(26px) saturate(1.45);
      -webkit-backdrop-filter: blur(26px) saturate(1.45);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .start-title {
      font-size: 55px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1e40af;
      margin-bottom: 1rem;
      line-height: 1.15;
      text-align: center;
    }

    .start-emoji {
      width: 100px;
      height: 100px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.95rem;
      filter: drop-shadow(0 6px 20px rgba(99, 102, 241, 0.25));
      user-select: none;
    }

    .start-emoji svg {
      width: 100%;
      height: 100%;
    }

    .start-diff {
      margin-bottom: 0;
    }

    .start-diff .btn-diff {
      font-size: 0.82rem;
      padding: 0.6rem 1rem;
    }

    .start-cat {
      margin-top: 0.85rem;
    }

    .btn-cat {
      font-size: 0.82rem;
    }

    .card-wrap {
      width: 110px;
      height: 110px;
      cursor: pointer;
      border-radius: 14px;
      perspective: 1000px;
      position: relative;
    }

    .card {
      position: relative;
    }

    .card-wrap:not(.flipped):not(.matched):hover .card::after {
      content: attr(data-hint);
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e3a5f;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      white-space: normal;
      width: max-content;
      min-width: 150px;
      max-width: 250px;
      z-index: 9999;
      pointer-events: none;
      box-shadow: 0 6px 16px rgba(30, 58, 95, 0.3);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      line-height: 1.4;
    }

    .card:not([data-hint])::after,
    .card[data-hint=""]::after {
      display: none;
    }

    /* —— Game view —— */
    .app {
      width: 95vw !important;
      max-width: 1400px;
      min-height: auto;
      overflow-y: visible;
      transition: max-width 0.35s var(--flip-ease);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start !important;
      align-items: center !important;
      gap: 20px !important;
      padding-top: 10px;
    }

    .app.app-easy {
      max-width: 760px;
    }

    .app.app-medium {
      max-width: 860px;
    }

    .app.app-hard {
      max-width: 940px;
    }

    /* —— Difficulty —— */
    .diff-bar {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .btn-diff {
      padding: 0.5rem 0.95rem;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      box-shadow: var(--glass-shadow);
      transition: transform 0.2s var(--flip-ease), background 0.25s ease, border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn-diff:hover {
      transform: scale(1.03);
    }

    .btn-diff:active {
      transform: scale(0.98);
    }

    .btn-diff.active {
      background: rgba(99, 102, 241, 0.38);
      border-color: rgba(129, 140, 248, 0.85);
      color: #1e1b4b;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.28), var(--glass-shadow);
    }

    .app.app-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      flex-wrap: wrap;
      margin: 0 0 0.1rem 0;
      width: 100%;
      text-align: center;
    }

    .game-title {
      font-size: clamp(1.8rem, 5.2vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--text);
      direction: ltr;
      margin: 0;
      text-align: center;
      width: 100%;
    }

    .game-emoji {
      width: clamp(2.5rem, 8vw, 3.5rem);
      height: clamp(2.5rem, 8vw, 3.5rem);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .game-emoji svg {
      width: 100%;
      height: 100%;
    }

    .mascot-monitor {
      overflow: visible;
    }

    .mascot-eye-open,
    .mascot-eye-closed {
      transform-origin: center;
      transition: opacity 0.15s ease;
    }

    .mascot-eye-closed {
      opacity: 0;
    }

    .mascot-monitor.is-blinking .mascot-eye-open {
      opacity: 0;
    }

    .mascot-monitor.is-blinking .mascot-eye-closed {
      opacity: 1;
    }

    .game-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.2rem;
    }

    .btn-home {
      padding: 0.65rem 1.2rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .btn-home:hover {
      transform: scale(1.04);
      color: var(--text);
    }

    /* —— HUD —— */
    .hud {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0 !important;
      margin-bottom: 0 !important;
    }

    .stat {
      flex: 1;
      min-width: 130px;
      padding: 0.85rem 1.1rem;
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      text-align: center;
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.35rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .btn-restart {
      align-self: center;
      margin-top: 0.5rem;
      padding: 0.55rem 1.15rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s var(--flip-ease), box-shadow 0.2s;
    }

    .btn-restart:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
    }

    .btn-restart:active {
      transform: scale(0.98);
    }

    .btn-start {
      padding: 0.75rem 2rem;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    .game-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
      width: 100%;
    }

    .info-panel {
      position: absolute;
      top: 150px;
      right: 5%;
      width: min(280px, 100%);
      height: 400px;
      padding: 1.2rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid var(--glass-border);
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      transform: translateY(0);
      pointer-events: none;
      z-index: 100;
    }

    .info-panel.info-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition: opacity 0.38s ease, transform 0.38s ease;
    }

    .info-panel.fade-in {
      animation: info-fade-in 0.4s ease;
    }

    @keyframes info-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .info-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      direction: ltr;
    }

    .info-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .info-desc {
      margin-top: 0.55rem;
      font-size: 0.93rem;
      line-height: 1.6;
      color: rgba(45, 27, 78, 0.9);
      min-height: 3.2em;
      max-width: 26ch;
    }

    .info-icon {
      margin-top: 0.95rem;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .info-icon .card-fa {
      font-size: 2.35rem;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.16));
    }

    .info-icon .card-brand-svg {
      width: 2.45rem;
      height: 2.45rem;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.16));
    }

    .game-main {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .game-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* —— Board —— */
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.78rem;
      perspective: 1200px;
      transition: gap 0.25s ease;
      max-width: 800px;
      margin: 0 auto;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .app-hard .board {
      gap: 0.5rem;
      max-width: 800px;
      grid-template-columns: repeat(4, 1fr);
    }

    .app-easy .board {
      gap: 0.75rem;
    }

    .card-wrap {
      aspect-ratio: 1;
      cursor: pointer;
      border-radius: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    .card-wrap.disabled {
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: center center;
      border-radius: 14px;
      transition: transform var(--flip-duration) var(--flip-ease);
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --flip-duration: 0.2s;
        --flip-ease: ease-out;
      }
    }

    .card-wrap.flipped .card {
      transform: rotateY(180deg);
    }

    .card-wrap.matched .card {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .face.back {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.12) 100%);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      transform: rotateY(0deg);
    }

    .face.back::after {
      content: "";
      width: 42%;
      height: 42%;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(56, 189, 248, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .face.front {
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      transform: rotateY(180deg);
      flex-direction: column;
      padding: 0.35rem 0.25rem 0.45rem;
    }

    .card-front-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .card-icon-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
    }

    .card-label {
      font-family: ui-sans-serif, system-ui, "Segoe UI", "Outfit", sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(248, 250, 252, 0.95);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
      letter-spacing: 0.03em;
      line-height: 1.15;
      text-align: center;
      flex-shrink: 0;
      direction: ltr;
      unicode-bidi: embed;
    }

    .card-wrap.matched .face.front {
      border-color: rgba(167, 243, 208, 0.8);
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.35), var(--glass-shadow);
    }

    .face.front .card-fa,
    .face.front .card-tech-emoji {
      font-size: clamp(2.45rem, 11vw, 3.85rem);
      line-height: 1;
      filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .app-easy .face.front .card-fa {
      font-size: clamp(2.65rem, 15vw, 4.15rem);
    }

    .app-easy .face.front .card-brand-svg {
      width: clamp(2.85rem, 16vw, 4.35rem);
      height: clamp(2.85rem, 16vw, 4.35rem);
    }

    .app-hard .face.front .card-fa {
      font-size: clamp(1.65rem, 5.2vw, 2.55rem);
    }

    .app-hard .face.front .card-brand-svg {
      width: clamp(1.75rem, 5.8vw, 2.75rem);
      height: clamp(1.75rem, 5.8vw, 2.75rem);
    }

    .app-hard .card-label {
      font-size: 10px;
    }

    .face.front .card-fa.card-fa-js {
      color: #f7df1e;
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.45)) drop-shadow(0 3px 12px rgba(0, 0, 0, 0.22));
    }

    .card-tech-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.2em;
      padding: 0.2em 0.44em;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.95), rgba(56, 189, 248, 0.92));
      color: #f8fafc;
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(1.1rem, 4.2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
    }

    .info-icon .card-tech-badge {
      font-size: 1.45rem;
      min-width: 2.4em;
    }

    .face.front .card-brand-svg {
      width: clamp(2.65rem, 12vw, 4.1rem);
      height: clamp(2.65rem, 12vw, 4.1rem);
      flex-shrink: 0;
      filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.2));
    }

    /* —— Win overlay —— */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 27, 78, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
      z-index: 100;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      max-width: 340px;
      width: 100%;
      padding: 1.75rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(99, 102, 241, 0.2);
      text-align: center;
      transform: scale(0.92);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .overlay.open .modal {
      transform: scale(1);
    }

    .modal h2 {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
    }

    .modal p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text);
      opacity: 0.9;
    }

    @media (min-width: 400px) {
      .board {
        gap: 0.85rem;
      }
    }

    @media (max-width: 780px) {
      .game-shell {
        flex-direction: column;
      }

      .game-main {
        margin-left: 0;
      }

      .info-panel {
        width: 100%;
        flex: 0 0 auto;
        min-height: 0;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 0.55rem;
      }

      .start-inner {
        padding: 1.15rem 0.85rem 1.2rem;
      }

      .start-emoji {
        width: 84px;
        height: 84px;
        margin-bottom: 0.5rem;
      }

      .start-title {
        font-size: 36px;
      }

      .game-header {
        gap: 0.35rem;
        margin-bottom: 0.35rem;
      }

      .game-title {
        font-size: clamp(0.9rem, 3.3vw, 1.05rem);
      }

      .game-emoji {
        width: 1.5rem;
        height: 1.5rem;
      }

      .game-toolbar {
        margin-bottom: 0.42rem;
      }

      .game-shell {
        gap: 0.55rem;
        margin-bottom: 0.4rem;
      }

      .info-panel {
        padding: 0.5rem 0.52rem;
        border-radius: 12px;
      }

      .info-name {
        font-size: 1rem;
      }

      .info-meta {
        font-size: 0.8rem;
      }

      .info-desc {
        font-size: 0.8rem;

      function ensureAudioContext() {
        if (audioCtx) return audioCtx;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
        return audioCtx;
      }

      function playBeep(freq, durationMs, volume) {
        const ctx = ensureAudioContext();
        if (!ctx) return;
        if (ctx.state === "suspended") {
          ctx.resume().catch(function () {});
        }

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs / 1000);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + durationMs / 1000 + 0.02);
      }

      function soundFlip() {
        playBeep(400, 70, 0.028);
      }

      function soundMatch() {
        playBeep(800, 110, 0.032);

      function scheduleMascotBlink() {
        const mascots = document.querySelectorAll(".mascot-monitor");

        function queueNextBlink() {
          const delay = 3000 + Math.floor(Math.random() * 2000);
          setTimeout(function () {
            mascots.forEach(function (el) {
              el.classList.add("is-blinking");
            });
            setTimeout(function () {
              mascots.forEach(function (el) {
                el.classList.remove("is-blinking");
              });
              queueNextBlink();
            }, 170);
          }, delay);
        }

        queueNextBlink();
      }

      function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      }

      function startTimer() {
        if (started) return;
        started = true;
        timerId = setInterval(function () {
          seconds++;
          timerEl.textContent = formatTime(seconds);
        }, 1000);
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

        for (var category in CATEGORIES) {
          var list = CATEGORIES[category];
          for (var i = 0; i < list.length; i++) {
            if (list[i].id === id) return list[i];

      function setDifficulty(next) {
        difficulty = next;
        diffButtons.forEach(function (btn) {
          btn.classList.toggle("active", btn.dataset.diff === difficulty);
        });
      }

      function openGameFromStart(chosen) {
        setDifficulty(chosen);
        startScreen.classList.add("start-screen--hide");
        appEl.classList.remove("app-hidden");
        resetGame();
      }

      function goHome() {
        stopTimer();
        started = false;
        overlay.classList.remove("open");
        appEl.classList.add("app-hidden");
        startScreen.classList.remove("start-screen--hide");
      }

      function onCardClick(e) {
        const wrap = e.currentTarget;
        if (lock || wrap.classList.contains("flipped") || wrap.classList.contains("matched")) return;

        startTimer();
        soundFlip();
        wrap.classList.add("flipped");
        flipped.push(wrap);

        if (flipped.length < 2) return;

        lock = true;
        moves++;
        movesEl.textContent = String(moves);

        const a = flipped[0];
        const b = flipped[1];
        const match = a.dataset.pairId === b.dataset.pairId;

        if (match) {
          soundMatch();
          showLanguageInfo(a.dataset.pairId);
          matched += 2;
          a.classList.add("matched");
          b.classList.add("matched");
          flipped = [];
          lock = false;
          if (matched === totalCards) {
            stopTimer();
            winMsg.textContent =
              "Completed in " +
              formatTime(seconds) +
              " with " +
              moves +
              " attempts.";
            fireWinConfetti();
            overlay.classList.add("open");
          }
        } else {
          setTimeout(function () {
            a.classList.remove("flipped");
            b.classList.remove("flipped");
            flipped = [];
            lock = false;
          }, 820);
        }
      }

      restartBtn.addEventListener("click", resetGame);
      playAgainBtn.addEventListener("click", resetGame);
      btnHome.addEventListener("click", goHome);
      diffButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setDifficulty(btn.dataset.diff);
        });
      });
      categoryButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setCategory(btn.dataset.category);
        });
      });
      startGameBtn.addEventListener("click", function () {
        openGameFromStart(difficulty);
      });
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) overlay.classList.remove("open");
      });

      scheduleMascotBlink();

    })();
  </script>

  </body>
</html>
